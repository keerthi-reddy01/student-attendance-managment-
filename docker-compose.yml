services:
  attendance:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-attendance:1.0.0
    container_name: student-attendance-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      SEED_ON_EMPTY: "true"
    volumes:
      - attendance-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  attendance-data:
    name: student-attendance-data
